<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="refresh"
      content="0; url=https://klassenwand.vercel.app/"
    />
    <link rel="canonical" href="https://klassenwand.vercel.app/" />
    <title>Klassenwand öffnen</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f9f3;
        color: #263e35;
        font:
          1rem/1.6 Arial,
          sans-serif;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 2.5rem;
        letter-spacing: -0.04em;

        background: #38634e;
        color: white;
        border-radius: 0.6rem;

      a:focus-visible {

        outline-offset: 4px;

  <body>
    <main>
      <h1>Klassenwand.</h1>
      <p>Deine Klassenwand öffnet sich gleich.</p>
