services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: klassenwand
      POSTGRES_PASSWORD: klassenwand
      POSTGRES_DB: klassenwand
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - klassenwand-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klassenwand"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  klassenwand-db:
